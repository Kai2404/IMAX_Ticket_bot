name: Odyssea IMAX watch

on:
  schedule:
    # каждые 15 минут
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: imax-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watch_imax.py

      - name: Commit updated state
        run: |
          git config user.name "imax-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/dates.json
          git diff --quiet --cached || git commit -m "Update known IMAX dates [skip ci]"
          git push

